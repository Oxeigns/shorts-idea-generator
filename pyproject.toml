[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pyflakes, import sorting and the pycodestyle error rules. Formatting rules are
# deliberately not enforced; the project is already consistently formatted.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
