<!doctype html>
<html lang="en" data-theme="{{ theme or 'dark' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · ViralShorts Ideas</title>
  <meta name="theme-color" content="#f2f2f7">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a84ff'/><path d='M53 16 28 55h18l-4 29 28-42H52z' fill='%23fff'/></svg>">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="brand big">
        <span class="brand-mark" aria-hidden="true">VS</span>
        <span class="brand-text">Viral<span>Shorts</span> <em>Ideas</em></span>
      </div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to generate Hindi Shorts ideas and ElevenLabs voiceovers.</p>

      {% if error %}
      <div class="banner error"><strong>{{ error }}</strong></div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="field">
          <span class="field-label">Username</span>
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-wide" type="submit">Sign in</button>
      </form>

      <p class="login-foot">
        <span data-clock-date>{{ clock.date }}</span> · <span data-clock-time>{{ clock.time }}</span> IST
      </p>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
